<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Product Explorer</title>
</head>
<body>

  <input type="text" id="search-input" placeholder="Cari produk...">
  <select id="category-select">
    <option value="all">Semua Kategori</option>
    <option value="electronics">Electronics</option>
    <option value="fashion">Fashion</option>
  </select>

  <div id="product-list"></div>

  <script>
    // Data produk
    const initialProducts = [
      { id: 1, title: "Laptop", category: "electronics", price: 1200 },
      { id: 2, title: "Shirt", category: "fashion", price: 20 }
    ];

    // State aplikasi
    const state = {
      products: initialProducts,
      search: "",
      category: "all"
    };

    // 17.1 Render produk ke DOM
    function renderProducts(products) {
      const container = document.querySelector("#product-list");
      container.innerHTML = "";
      for (const product of products) {
        const card = document.createElement("div");
        card.innerHTML = `<h3>${product.title}</h3><p>$${product.price}</p>`;
        container.appendChild(card);
      }
    }

    // 18.1 Function render berbasis state
    function render() {
      const filtered = state.products.filter(p => {
        const matchSearch = p.title.toLowerCase().includes(state.search.toLowerCase());
        const matchCategory = state.category === "all" || p.category === state.category;
        return matchSearch && matchCategory;
      });
      renderProducts(filtered);
    }

    // Event listener pengubah state
    document.querySelector("#search-input").addEventListener("input", (e) => {
      state.search = e.target.value;
      render();
    });

    document.querySelector("#category-select").addEventListener("change", (e) => {
      state.category = e.target.value;
      render();
    });

    render();
  </script>
</body>
</html>
